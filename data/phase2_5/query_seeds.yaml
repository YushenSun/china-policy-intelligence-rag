queries:
- query_id: Q01
  text: 哪些机构研发或应用生成式人工智能技术但未向境内公众提供服务时，不适用《生成式人工智能服务管理暂行办法》？
  language: zh
  query_type: direct
  expected_files:
  - phase2_5/cn_genai_interim_measures_2023.html
  notes: Scope exclusion; requires the provision on research or internal use not offered to the public.
- query_id: Q02
  text: When does China's interim generative AI regulation not apply to research, institutional use, or internal development?
  language: en
  query_type: cross-language
  expected_files:
  - phase2_5/cn_genai_interim_measures_2023.html
  notes: English query should retrieve the Chinese source.
- query_id: Q03
  text: 在境外处理中国境内自然人个人信息，哪些情况下《网络数据安全管理条例》适用？
  language: zh
  query_type: direct
  expected_files:
  - phase2_5/cn_network_data_security_regulation_2024.html
  notes: Territorial scope of the regulation.
- query_id: Q04
  text: Under China’s Personal Information Protection Law, when can processing outside China fall within the law’s territorial
    scope?
  language: en
  query_type: cross-language
  expected_files:
  - phase2_5/cn_personal_information_protection_law_2021_zh.html
  notes: English query should retrieve the Chinese PIPL provisions.
- query_id: Q05
  text: 重要数据处理者需要定期开展什么评估，并向主管部门提交哪些内容？
  language: zh
  query_type: direct
  expected_files:
  - phase2_5/cn_data_security_law_2021_zh.html
  notes: Risk-assessment duty and report contents.
