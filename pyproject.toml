[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "china-policy-intelligence-rag"
version = "0.6.0"
description = "可审计的中欧政策智能代理，支持多种 LLM 和只读 MCP。 / Auditable China-EU policy agent with multi-LLM support and read-only MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Project Contributors" }]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "beautifulsoup4>=4.12,<5",
    "pypdf>=4.2,<7",
    "PyYAML>=6.0,<7",
    "numpy>=1.26,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8.2,<9",
    "ruff>=0.5,<1",
    "types-PyYAML>=6.0,<7",
]

semantic = ["sentence-transformers>=3,<6"]
openai = ["openai>=1.66,<3"]
deepseek = ["openai>=1.66,<3"]
agent = ["openai-agents>=0.19.4,<1"]
mcp = ["mcp>=1.29,<2"]

[project.scripts]
china-policy-rag = "china_policy_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/china_policy_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
