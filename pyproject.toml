[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "china-policy-intelligence-rag"
version = "0.1.0"
description = "Phase 0 foundation for a source-grounded China policy intelligence prototype."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Project Contributors" }]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8.2,<9",
    "ruff>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/china_policy_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
